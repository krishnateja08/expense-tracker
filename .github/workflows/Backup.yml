name: Backup Firestore data to private repo

on:
  schedule:
    - cron: '0 7 * * *'   # 7:00 UTC daily — change to whatever time you like
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expense-tracker
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Run backup script
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node backup.js

      # ---- Update the owner/repo below to match your private repo ----
      - name: Checkout private backup repo
        uses: actions/checkout@v4
        with:
          repository: krishnateja08/myprivate_Repo
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-target

      - name: Copy backup file into private repo
        run: |
          mkdir -p backup-target/expense-tracker-backups
          cp backups/backup.json backup-target/expense-tracker-backups/backup.json

      - name: Commit and push backup
        run: |
          cd backup-target
          git config user.name "expense-tracker-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add expense-tracker-backups/backup.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Backup: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
